name: Nika U21 Weekly Snapshot

on:
  schedule:
    - cron: "30 13 * * 5"
      timezone: "Asia/Jerusalem"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check the API without publishing a snapshot"
        required: false
        default: true
        type: boolean
      week:
        description: "Optional season week override"
        required: false
        type: string
      countries:
        description: "Optional comma-separated country codes for a dry run"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: u21-tracker-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect U21 tracker snapshot
        env:
          BB_U21_API_TOKEN: ${{ secrets.BB_U21_API_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_COUNTRIES: ${{ inputs.countries }}
        run: |
          EXTRA=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            EXTRA+=(--dry-run)
          fi
          if [ -n "$INPUT_WEEK" ]; then
            EXTRA+=("--week=$INPUT_WEEK")
          fi
          if [ -n "$INPUT_COUNTRIES" ]; then
            EXTRA+=("--countries=$INPUT_COUNTRIES")
          fi
          python collect_u21_tracker.py "${EXTRA[@]}"

      - name: Commit tracker JSON
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/v1/production-u21-tracker/
          if git diff --staged --quiet; then
            echo "No tracker JSON changes to commit."
            exit 0
          fi

          git commit -m "chore: update U21 tracker weekly snapshot"
          if git push origin "HEAD:$GITHUB_REF_NAME"; then
            exit 0
          fi

          echo "Initial push failed; refreshing from remote and retrying."
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push failed on attempt $attempt; retrying after remote refresh."
            sleep 5
          done

          echo "Failed to push tracker snapshot after 3 attempts."
          exit 1
